summary: PosterChan's Firefox for Android — your bookmarks synced with PosterChan, no telemetry
description: |
  **PosterFox** is the PosterChan-branded Firefox for Android: Mozilla's Firefox engine and app, with the PosterChan
  extension built in.

  - **Bookmark sync with PosterChan**: the same bookmarks as PosterFox on your desktop and the PosterChan add-on in
    Firefox, Chrome, Edge and Brave — end-to-end encrypted with your vault key, stored on your own relay.
  - **Passwords**: your PosterChan password vault, filled into websites.
  - **No telemetry**: usage data and crash reporting are off from the first start.
  - **uBlock Origin and Privacy Badger** installed on first start, kept up to date from addons.mozilla.org.

  Built from Mozilla's Firefox release source with a small set of public changes, on GitHub Actions.

